<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
    <meta name="theme-color" content="#161019">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Flomation Form</title>
    <style>
        :root {
            --bg: #161019;
            --surface: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.08);
            --border-focus: rgba(139,92,246,0.5);
            --text: #fff;
            --text-muted: rgba(255,255,255,0.5);
            --primary: #460070;
            --primary-hover: #6b21a8;
            --input-bg: #17202e;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; min-height: 100%;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            color: var(--text);
            background: radial-gradient(ellipse at top left, var(--bg), #1a1025);
        }

        .page-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .form-card {
            width: 100%;
            max-width: 560px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 36px 32px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .form-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-description {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .field-group { margin-bottom: 20px; }

        .field-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .field-label .required {
            color: var(--danger);
            margin-left: 2px;
        }

        input[type="text"], input[type="number"], textarea {
            width: 100%;
            padding: 12px 14px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input[type="text"]:focus, input[type="number"]:focus, textarea:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(139,92,246,0.15);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
        }

        .checkbox-group:hover {
            border-color: rgba(255,255,255,0.15);
        }

        .checkbox-group input[type="checkbox"] {
            -webkit-appearance: none;
            appearance: none;
            width: 20px; height: 20px;
            min-width: 20px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            background: transparent;
            cursor: pointer;
            position: relative;
        }

        .checkbox-group input[type="checkbox"]:checked {
            background: var(--primary);
            border-color: var(--primary);
        }

        .checkbox-group input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 5px; top: 2px;
            width: 6px; height: 10px;
            border: solid #fff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .checkbox-group label {
            font-size: 14px;
            color: var(--text);
            cursor: pointer;
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 28px;
        }

        .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background 0.15s ease, opacity 0.15s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: #fff;
        }

        .btn-primary:hover { opacity: 0.9; }

        .btn-secondary {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .btn-secondary:hover { background: rgba(255,255,255,0.08); }

        .btn:disabled { opacity: 0.35; cursor: not-allowed; }

        .btn-submit {
            background: linear-gradient(135deg, #059669, var(--success));
            color: #fff;
        }

        .page-indicator {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin: 32px 0 36px;
            padding: 16px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .page-dot {
            display: inline-block;
            width: 10px; height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .page-dot.active {
            background: var(--primary-hover);
            transform: scale(1.2);
        }

        .hidden { display: none; }

        .success-message {
            text-align: center;
            padding: 40px 20px;
        }

        .success-icon { font-size: 48px; margin-bottom: 16px; }
        .success-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
        .success-text { font-size: 14px; color: var(--text-muted); }

        .footer {
            margin-top: 32px;
            text-align: center;
        }

        .footer img { height: 20px; opacity: 0.3; }
        .footer img:hover { opacity: 0.6; }
    </style>
</head>
<body>
<div class="page-container">
    <div class="form-card" id="form-container">
        <div class="form-title" id="form-header">Form</div>
        <div class="form-description" id="form-description"></div>
        <div id="page-indicator"></div>
        <div id="form-body"></div>
    </div>
    <div class="footer">
        <a href="https://www.flomation.co" target="_blank" title="Powered by Flomation">
            <img src="/flomation-wordtype-small-white.png" alt="Powered by Flomation"/>
        </a>
    </div>
</div>

<script>
    const formData = atob("{{ .Form }}");
    let formValues = {};
    let currentPage = 0;

    function renderLabel(component) {
        const el = document.createElement("label");
        el.classList.add("field-label");
        el.textContent = component.label;
        if (component.required) {
            const star = document.createElement("span");
            star.classList.add("required");
            star.textContent = " *";
            el.appendChild(star);
        }
        return el;
    }

    function renderTextbox(form, container, component) {
        const group = document.createElement("div");
        group.classList.add("field-group");
        group.appendChild(renderLabel(component));

        const el = document.createElement("input");
        el.type = "text";
        el.placeholder = component.placeholder || "";
        el.required = !!component.required;
        el.id = "input-" + component.name;
        el.oninput = (e) => { formValues[component.name] = e.target.value; validateForm(form); };

        group.appendChild(el);
        container.appendChild(group);
    }

    function renderMultiline(form, container, component) {
        const group = document.createElement("div");
        group.classList.add("field-group");
        group.appendChild(renderLabel(component));

        const el = document.createElement("textarea");
        el.placeholder = component.placeholder || "";
        el.required = !!component.required;
        el.id = "input-" + component.name;
        el.oninput = (e) => { formValues[component.name] = e.target.value; validateForm(form); };

        group.appendChild(el);
        container.appendChild(group);
    }

    function renderNumber(form, container, component) {
        const group = document.createElement("div");
        group.classList.add("field-group");
        group.appendChild(renderLabel(component));

        const el = document.createElement("input");
        el.type = "number";
        el.placeholder = component.placeholder || "";
        el.required = !!component.required;
        el.id = "input-" + component.name;
        el.oninput = (e) => { formValues[component.name] = e.target.value; validateForm(form); };

        group.appendChild(el);
        container.appendChild(group);
    }

    function renderCheckbox(form, container, component) {
        const group = document.createElement("div");
        group.classList.add("field-group");

        const wrapper = document.createElement("div");
        wrapper.classList.add("checkbox-group");

        const el = document.createElement("input");
        el.type = "checkbox";
        el.id = "input-" + component.name;
        el.onchange = (e) => { formValues[component.name] = e.target.checked; validateForm(form); };

        const label = document.createElement("label");
        label.htmlFor = "input-" + component.name;
        label.textContent = component.label;

        wrapper.appendChild(el);
        wrapper.appendChild(label);
        group.appendChild(wrapper);
        container.appendChild(group);
    }

    function renderPageIndicator(form) {
        const indicator = document.getElementById("page-indicator");
        if (!indicator || form.pages.length <= 1) return;

        indicator.innerHTML = "";
        for (let i = 0; i < form.pages.length; i++) {
            const dot = document.createElement("span");
            dot.classList.add("page-dot");
            if (i === currentPage) dot.classList.add("active");
            indicator.appendChild(dot);
        }
    }

    function renderPage(form, pageNumber) {
        const container = document.getElementById("form-body");
        if (!container || !form || form.pages.length < pageNumber) return;

        const page = form.pages[pageNumber];
        const pageContainer = document.createElement("div");
        pageContainer.id = "page-" + pageNumber;
        pageContainer.classList.add("hidden");
        container.appendChild(pageContainer);

        const components = [...page.components].sort((a, b) => (a.order || 0) - (b.order || 0));

        for (const component of components) {
            formValues[component.name] = component.type === "boolean" ? false : null;

            switch (component.type) {
                case "text": renderTextbox(form, pageContainer, component); break;
                case "multiline": renderMultiline(form, pageContainer, component); break;
                case "number": renderNumber(form, pageContainer, component); break;
                case "boolean": renderCheckbox(form, pageContainer, component); break;
                default: renderTextbox(form, pageContainer, component); break;
            }
        }
    }

    function validateForm(form) {
        let valid = true;
        for (const page of form.pages) {
            for (const comp of page.components) {
                if (comp.required) {
                    const input = document.getElementById("input-" + comp.name);
                    if (input && (input.value === "" || input.value === null)) valid = false;
                }
            }
        }

        const submit = document.getElementById("submit");
        if (submit) {
            submit.disabled = !valid;
        }
    }

    function setPage(form, page) {
        currentPage = Math.max(0, Math.min(page, form.pages.length - 1));

        for (let p = 0; p < form.pages.length; p++) {
            const el = document.getElementById("page-" + p);
            if (el) el.classList.toggle("hidden", p !== currentPage);
        }

        const prev = document.getElementById("previous");
        if (prev) prev.disabled = currentPage === 0;

        const next = document.getElementById("next");
        if (next) next.disabled = currentPage === form.pages.length - 1;

        renderPageIndicator(form);
    }

    function renderForm() {
        const form = JSON.parse(formData);
        if (!form) return;

        document.getElementById("form-header").textContent = form.title || "Form";
        const desc = document.getElementById("form-description");
        if (form.description) desc.textContent = form.description;
        else desc.style.display = "none";

        for (let p = 0; p < form.pages.length; p++) renderPage(form, p);

        const container = document.getElementById("form-body");
        if (!container) return;

        const buttons = document.createElement("div");
        buttons.classList.add("button-row");

        if (form.pages.length > 1) {
            const prev = document.createElement("button");
            prev.textContent = "Previous";
            prev.id = "previous";
            prev.classList.add("btn", "btn-secondary");
            prev.onclick = () => setPage(form, currentPage - 1);
            buttons.appendChild(prev);

            const next = document.createElement("button");
            next.textContent = "Next";
            next.id = "next";
            next.classList.add("btn", "btn-secondary");
            next.onclick = () => setPage(form, currentPage + 1);
            buttons.appendChild(next);
        }

        const submit = document.createElement("button");
        submit.textContent = "Submit";
        submit.id = "submit";
        submit.disabled = true;
        submit.classList.add("btn", "btn-submit");
        submit.onclick = () => submitForm(form);
        buttons.appendChild(submit);

        container.appendChild(buttons);
        setPage(form, 0);
    }

    function submitForm(form) {
        const submit = document.getElementById("submit");
        submit.disabled = true;
        submit.textContent = "Submitting...";

        const id = form.id;
        fetch("/form/" + id, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(formValues)
        })
        .then(() => {
            const container = document.getElementById("form-container");
            container.innerHTML = `
                <div class="success-message">
                    <div class="success-icon">&#x2705;</div>
                    <div class="success-title">Thank you!</div>
                    <div class="success-text">Your response has been submitted successfully.</div>
                </div>
            `;
        })
        .catch(() => {
            submit.disabled = false;
            submit.textContent = "Submit";
        });
    }

    renderForm();
</script>
</body>
</html>
